[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nntrain"
dynamic = ["version"]
description = "Training runtime for nnm models"
authors = [
    {name = "Jiau Zhang", email = "jiauzhang@163.com"},
]
requires-python = ">=3.10"
dependencies = [
    "nnm",
    "nnserve",
    "lossers",
    "conippets>=0.1.15",
    "torch>=2.7.1",
    "safetensors",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.17.0",
]

[tool.hatch.version]
path = "nntrain/version.py"

[tool.hatch.build.targets.wheel]
packages = ["nntrain"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLC0415"]
